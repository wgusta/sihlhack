name: CI
run-name: CI ${{ inputs.request_id || github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional Hermes delivery request id
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ci
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: ${{ secrets.SIHLHACK_CI_POSTGRES_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:design-tokens
      - run: npm run lint:tokens
      - name: Install browser for DB-backed smoke
        if: env.POSTGRES_URL != ''
        run: npx --no-install playwright install --with-deps chromium
      - name: Run DB-backed simulation smoke
        if: env.POSTGRES_URL != ''
        run: npm run test:sim:smoke -- --reporter=line
      - run: npm run build
      - run: node scripts/verify-ci-contract.mjs
